name: Deploy Michelle Diamond to Pages

# Builds the TanStack Start app, prerenders the public marketing routes to
# static HTML, and publishes .output/public to GitHub Pages.
# Live URL: https://walkswithaswagger.github.io/michelle-diamond/

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/prerender-public-pages.mjs"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/pages-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  MICHELLE_DIAMOND_PUBLIC_BASE: /michelle-diamond/

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Prerender public routes
        run: node scripts/prerender-public-pages.mjs

      - name: Preserve underscore-prefixed Pages assets
        run: touch .output/public/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .output/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
